name: gamepulse-analytics

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gamepulse-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaming_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "com.docker.compose.project=gamepulse-analytics"
      - "org.opencontainers.image.title=GamePulse PostgreSQL Database"

  # ----------------------------------------------------------------------------
  # FastAPI Analytical Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamepulse-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gaming_db
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    labels:
      - "com.docker.compose.project=gamepulse-analytics"
      - "org.opencontainers.image.title=GamePulse REST API"

  # ----------------------------------------------------------------------------
  # React 18 + Nginx Production Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gamepulse-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    labels:
      - "com.docker.compose.project=gamepulse-analytics"
      - "org.opencontainers.image.title=GamePulse Web Dashboard"

volumes:
  postgres_data:
    name: gamepulse_postgres_data
